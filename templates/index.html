<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Blob animation */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blurs -->
    <div
        class="absolute top-0 left-0 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob">
    </div>
    <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000">
    </div>

    <main class="w-full max-w-2xl z-10">
        <div class="glass-panel rounded-2xl p-8 shadow-2xl backdrop-blur-xl border-slate-700/50">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold mb-3 tracking-tight"><span class="gradient-text">AI App Builder</span>
                </h1>
                <p class="text-gray-400">Describe your dream application, and we'll build it for you.</p>
            </div>

            <div id="input-section" class="space-y-6">
                <div>
                    <label for="prompt" class="block text-sm font-medium text-gray-300 mb-2">Project Description</label>
                    <textarea id="prompt"
                        class="w-full h-32 bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"
                        placeholder="e.g., A personal finance tracker with a dashboard using React and Chart.js..."></textarea>
                </div>

                <button onclick="generateProject()" id="generate-btn"
                    class="w-full btn-gradient text-white font-semibold py-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/20">
                    <span>Generate Project</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </button>
            </div>

            <div id="loading-section" class="hidden text-center py-12 space-y-4">
                <div class="relative w-20 h-20 mx-auto">
                    <div class="absolute inset-0 border-4 border-slate-700/50 rounded-full"></div>
                    <div
                        class="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin">
                    </div>
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-white">Building your app...</h3>
                    <p class="text-gray-400 text-sm mt-2">Planning architecture, writing code, and polishing...</p>
                </div>
            </div>

            <div id="result-section" class="hidden text-center py-8 space-y-6 animate-fade-in">
                <div
                    class="w-16 h-16 bg-green-500/10 text-green-400 rounded-full mx-auto flex items-center justify-center ring-1 ring-green-500/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>

                <div>
                    <h3 class="text-2xl font-bold text-white">Project Ready!</h3>
                    <p class="text-gray-400 mt-2">Your application has been successfully generated.</p>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <a href="/download"
                        class="col-span-1 block w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-4 rounded-xl transition border border-slate-600 flex items-center justify-center space-x-2 group">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span>Download ZIP Project</span>
                    </a>
                </div>

                <button onclick="resetUI()" class="text-sm text-gray-500 hover:text-gray-300 hover:underline pt-4">Build
                    another app</button>
            </div>
        </div>
    </main>

    <script>
        async function generateProject() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) {
                document.getElementById('prompt').focus();
                return;
            }

            // Show loading
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt }),
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('loading-section').classList.add('hidden');
                    document.getElementById('result-section').classList.remove('hidden');
                } else {
                    alert('Error: ' + data.message);
                    resetUI();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during network request. Please check the console.');
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('prompt').value = '';
        }
    </script>
</body>

</html>
